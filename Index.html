<style>
/* Layout idea: one calm column, the lake route as the single memorable element, lemon reserved for celebration. */
:root{
  --bg:#eef3f6; --surface:#ffffff; --surface2:#e0eaf0; --ink:#0a2433; --muted:#566d7c; --line:#d2dee6;
  --lake:#044d71; --lake-deep:#053a57; --lake-soft:#d8effa; --sky:#04a7e0; --lemon:#f3c62f; --lemon-ink:#5b4500;
  --good:#23936a; --warn:#d98a12; --bad:#cf4f3c;
  --k-long:#044d71; --k-quality:#c2457c; --k-easy:#0096cc; --k-strength:#7d8a36; --k-bike:#6a5fc0; --k-reset:#8196a3;
  --display:"Bricolage Grotesque","Avenir Next",-apple-system,system-ui,sans-serif;
  --body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --r:18px; --r-sm:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#06161f; --surface:#0d2531; --surface2:#143445; --ink:#e6f1f6; --muted:#8fa8b5; --line:#1d3f50;
    --lake:#3dbdee; --lake-deep:#bfe6f7; --lake-soft:#0f3a4f; --sky:#3dbdee; --lemon:#f3c62f; --lemon-ink:#f7dc7a;
    --good:#3fbf8d; --warn:#f0a93a; --bad:#ee7b68;
    --k-long:#a5dcf3; --k-quality:#e87aa8; --k-easy:#4cc4f0; --k-strength:#b4c25c; --k-bike:#a79df0; --k-reset:#8fa8b5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06161f; --surface:#0d2531; --surface2:#143445; --ink:#e6f1f6; --muted:#8fa8b5; --line:#1d3f50;
    --lake:#3dbdee; --lake-deep:#bfe6f7; --lake-soft:#0f3a4f; --sky:#3dbdee; --lemon:#f3c62f; --lemon-ink:#f7dc7a;
    --good:#3fbf8d; --warn:#f0a93a; --bad:#ee7b68;
    --k-long:#a5dcf3; --k-quality:#e87aa8; --k-easy:#4cc4f0; --k-strength:#b4c25c; --k-bike:#a79df0; --k-reset:#8fa8b5;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:var(--ink)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--lemon);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

#app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px);display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.h-page{font-size:30px;font-weight:700;line-height:1.05}
.h-sec{font-size:19px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:600;background:var(--lake);color:#fff}
:root[data-theme="dark"] .btn{color:#04202e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#04202e}}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14.5px;border-radius:12px}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:500}
.chip.on{background:var(--lake);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#04202e}}
:root[data-theme="dark"] .chip.on{color:#04202e}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;align-self:center;background:color-mix(in srgb,var(--kc) 16%,var(--surface));color:var(--kc)}
.ic svg{width:23px;height:23px}
.ic.s{width:32px;height:32px;border-radius:10px}.ic.s svg{width:19px;height:19px}
.surf{display:inline-flex;align-items:center;gap:3px;margin-left:8px;white-space:nowrap}.surf svg{width:14px;height:14px}
.map{height:230px;border-radius:14px;overflow:hidden;background:var(--surface2);z-index:0;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:0}
.map .leaflet-control-attribution{font-size:9px}
.wx{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border-radius:var(--r-sm);padding:10px 12px;font-size:14.5px}
.wx svg{width:24px;height:24px;flex:none;color:var(--lake);margin-top:1px}
.dwx{display:flex;align-items:center;gap:2px;font-size:11px}.dwx svg{width:13px;height:13px}
.racecard{flex-direction:row;align-items:center;gap:14px}
.plate{background:#fff;border-radius:14px;padding:10px;flex:none;line-height:0;border:1px solid var(--line)}
.plate img{width:116px;height:auto;display:block}
.brand{display:flex;align-items:center;gap:12px}
.brand .plate{padding:6px;border-radius:12px}.brand .plate img{width:50px}
.brand b{font-family:var(--display);font-size:18px;line-height:1.1;display:block}
.pill{background:var(--lake);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
:root[data-theme="dark"] .pill{color:#04202e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill{color:#04202e}}
.cele-card .plate img{width:64px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--kc,var(--k-reset));flex:none}

/* header + route */
.hero{background:var(--lake-deep);color:#eef8fd;border-radius:24px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
:root[data-theme="dark"] .hero{background:#06324a;color:#eef8fd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:#06324a;color:#eef8fd}}
.scene{margin:-18px -18px 6px;line-height:0}.scene svg{display:block;width:100%;height:auto}
.hero h1{font-size:28px;line-height:1.08}
.hero .sub{color:#a9d8ee;font-size:14.5px}
.route{width:100%;height:auto;display:block;margin-top:2px}
.route text{font-family:var(--body);font-size:11px;fill:#a9d8ee}
.hero-stats{display:flex;gap:18px;font-size:13.5px;color:#a9d8ee}
.hero-stats b{display:block;font-family:var(--display);font-size:22px;color:#fff;font-weight:700;line-height:1.1}

/* session card */
.sess{display:flex;gap:12px;align-items:stretch;width:100%;padding:12px 0;border-top:1px solid var(--line)}
.sess:first-child{border-top:0;padding-top:0}.sess:last-child{padding-bottom:0}
.stripe{width:5px;border-radius:3px;background:var(--kc);flex:none}
.sess .t{font-weight:600;line-height:1.25}
.sess .m{font-size:13.5px;color:var(--muted)}
.st{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;align-self:center}
.st svg{width:14px;height:14px}
.st.done{background:var(--good);border-color:var(--good);color:#fff}
.st.partial{background:var(--warn);border-color:var(--warn);color:#fff}
.st.missed{border-color:var(--bad);color:var(--bad)}
.st.skip{border-color:var(--muted);color:var(--muted)}
.st.today{border-color:var(--lake)}
.big-sess{gap:12px}
.big-sess h2{font-size:23px;line-height:1.12}
.kline{display:flex;gap:14px;flex-wrap:wrap;font-size:14.5px}
.kline b{font-family:var(--display);font-size:20px;display:block;line-height:1.15}
.note{background:var(--lake-soft);border-radius:var(--r-sm);padding:11px 13px;font-size:14.5px}
.note.lemon{background:color-mix(in srgb,var(--lemon) 26%,var(--surface))}
.note.bad{background:color-mix(in srgb,var(--bad) 16%,var(--surface))}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px;font-size:12.5px;color:var(--muted);min-height:58px}
.day.sel{background:var(--surface2);color:var(--ink)}
.day .dn{font-family:var(--display);font-size:16px;font-weight:700;color:var(--ink)}
.day.now .dn{color:var(--lake)}
.pips{display:flex;gap:3px;min-height:8px}
.pip{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted)}
.pip.done{background:var(--good);border-color:var(--good)}
.pip.partial{background:var(--warn);border-color:var(--warn)}
.pip.missed{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 30%,transparent)}
.pip.opt{border-style:dotted}
.bar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--sky)}

/* plan */
.phase-h{display:flex;flex-direction:column;gap:2px;padding:8px 2px 0}
.wk-head{display:flex;align-items:center;gap:10px;width:100%}
.wk-n{font-family:var(--display);font-weight:700;font-size:18px}
.wk.now{outline:2px solid var(--lake)}
.dayrow{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.dayrow .dl{width:54px;flex:none;font-size:13px;color:var(--muted);padding-top:3px}
.dayrow .dl b{display:block;color:var(--ink);font-family:var(--display);font-size:15px}
.dayrow.now .dl b{color:var(--lake)}
.mini{display:flex;align-items:center;gap:9px;width:100%;padding:6px 0;min-height:40px}
.mini .t{font-size:15px;font-weight:500;line-height:1.2}
.mini .st{width:22px;height:22px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:20}
nav.tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0;min-height:50px;border-radius:12px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--lake)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(4,20,24,.5);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:24px 24px 0 0;max-height:92%;max-width:520px;margin:0 auto;display:none;flex-direction:column;animation:up .22s ease-out}
.open>.scrim{display:block}.open>.sheet{display:flex}
.sheet-in{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.x{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:12px}
.step .sn{width:84px;flex:none;font-size:13px;font-weight:600;color:var(--muted);padding-top:2px}
.ex{display:flex;gap:12px;align-items:flex-start;width:100%;padding:10px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff}
.box.on{background:var(--good);border-color:var(--good)}
.box svg{width:14px;height:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.field input,.field textarea,.field select{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-weight:400;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:var(--r);padding:14px}
.tile b{font-family:var(--display);font-size:26px;line-height:1.1;display:block}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:12.5px;line-height:1.2;color:var(--muted)}
.medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted);font-family:var(--display);font-weight:700;font-size:15px}
.badge.got{color:var(--ink)} .badge.got .medal{background:var(--lemon);color:#3d2f00}
details{border-top:1px solid var(--line);padding:12px 0}
details:first-of-type{border-top:0}
summary{font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;color:var(--muted);line-height:1}
details[open] summary::after{content:"–"}
details .body{padding-top:8px;display:flex;flex-direction:column;gap:8px;font-size:15px}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
td,th{text-align:left;padding:7px 4px;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted);border-top:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14.5px;font-weight:500;z-index:50;max-width:88%;text-align:center}
.cele{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(4,20,24,.6);padding:24px}
.cele.open{display:grid}
.cele-card{background:var(--surface);border-radius:26px;padding:26px 22px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;animation:up .3s ease-out}
.cele-card .medal{width:84px;height:84px;font-size:24px;background:var(--lemon);color:#3d2f00}
#confetti{position:fixed;inset:0;z-index:61;pointer-events:none}
.chart text{font-family:var(--body);font-size:10.5px;fill:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>
<div id="sheetwrap"><div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sheet-in" id="sheet"></div></div></div>
<div class="cele" id="cele"></div>
<canvas id="confetti"></canvas>
<script>
"use strict";
/* ============ dates ============ */
const START='2026-11-16', RACE='2027-04-11', NW=21;
const D=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((D(b)-D(a))/864e5);
const TODAY=()=>iso(new Date());
const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dow=s=>(D(s).getDay()+6)%7;
const fD=s=>{const d=D(s);return d.getDate()+' '+MN[d.getMonth()]};
const fDL=s=>DN[dow(s)]+' '+fD(s);
const wkOf=s=>Math.floor(diff(START,s)/7)+1;
const clampW=n=>Math.max(1,Math.min(NW,n));
const pace=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const pr=a=>pace(a[0])+'–'+pace(a[1])+' /km';
const hms=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'):m+':'+String(x).padStart(2,'0')};
const parseT=t=>{if(!t)return null;const p=String(t).trim().split(':').map(Number);if(p.some(isNaN))return null;return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0]*60};
const dur=m=>m>=60?Math.floor(m/60)+'h '+String(Math.round(m%60)).padStart(2,'0'):Math.round(m)+' min';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r1=n=>Math.round(n*10)/10;

/* ============ state ============ */
const KEY='garda42-v1';
const DEF={v:1,name:'Laura',goal:14280,tenK:3000,log:{},moves:{},swaps:{},strava:{},extra:{},times:['09:30','20:00','14:00','09:30','20:00','08:30','08:30'],seen:{},open:{}};
let S=JSON.parse(JSON.stringify(DEF)), memOnly=false;
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){memOnly=true}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){memOnly=true}}

/* ============ the plan ============ */
const PH=[
 {n:'Foundation',w:'Weeks 1–5',d:'Build the habit, the strength and the long run. Almost everything is easy.'},
 {n:'Build',w:'Weeks 6–11',d:'Long runs pass 25 km. Workouts get more structure.'},
 {n:'Marathon specific',w:'Weeks 12–18',d:'Goal-pace running inside long runs. Race fuelling rehearsed every week.'},
 {n:'Taper',w:'Weeks 19–21',d:'Less running, same rhythm. Arrive in Limone fresh.'}];
/* l: long run {km, mp (km at goal pace), pos:'end'|'mid', tt}. q: midweek workout. */
const WEEKS=[
 {p:0,l:{km:16},q:['strides',8],sat:8,sun:5,n:'Start gently. The only job this week is to finish every run feeling you could do more.'},
 {p:0,l:{km:18},q:['tempo',3,8,2,10],sat:8,sun:6,n:'First tempo and first gel. Tempo is comfortably hard: you could speak a short sentence.'},
 {p:0,l:{km:20},q:['hills',8,60,9],sat:9,sun:6,n:'20 km on Monday. Hills build strength without the pounding of fast flat running.'},
 {p:0,l:{km:14},q:['tt',5,9],sat:8,sun:5,n:'A lighter week so the work sinks in. Wednesday is a 5 km time trial to see where you are.'},
 {p:0,l:{km:21},q:['tempo',2,12,3,10],sat:9,sun:6,n:'Half marathon distance on Monday. Take it slowly and enjoy it.'},
 {p:1,l:{km:18},q:['fart',8,2,2,9],sat:8,sun:6,n:'Christmas week. Move sessions wherever they fit. Three runs done is a good week.'},
 {p:1,l:{km:23},q:['hills',10,60,10],sat:9,sun:6,n:'Back into it. Long runs now need fuel from the first half hour.'},
 {p:1,l:{km:25},q:['tempo',3,10,2,11],sat:10,sun:6,n:'25 km. Pick a route with a road stretch so some of it feels like race day.'},
 {p:1,l:{km:16},q:['tt',10,13],sat:8,sun:5,n:'Lighter week with a 10 km time trial on Wednesday. Your paces update from the result.'},
 {p:1,l:{km:26,steady:5},q:['int',5,2,11],sat:10,sun:6,n:'Finish Monday with 5 km a little quicker. Tired legs learning to hold form.'},
 {p:1,l:{km:28},q:['cont',25,10],sat:10,sun:6,n:'28 km. Practise the full race breakfast before this one.'},
 {p:2,l:{km:20,mp:8,pos:'mid'},q:['hills',6,90,9],sat:9,sun:5,n:'Lighter week and your first goal-pace running. It should feel controlled, not hard.'},
 {p:2,l:{km:29},q:['mp',3,3,13],sat:10,sun:6,n:'Goal pace on Wednesday, a long easy one on Monday. Do the goal-pace work on road.'},
 {p:2,l:{km:30,mp:6,pos:'end'},q:['tempo',2,15,3,11],sat:10,sun:6,n:'30 km with a goal-pace finish. This is the session that tells you sub-4 is real.'},
 {p:2,l:{km:23,tt:21.1},q:['strides',8],sat:9,sun:5,n:'Half marathon at a strong effort on Monday. If a local half falls this weekend, race that instead.'},
 {p:2,l:{km:32},q:['mp',1,10,13],sat:8,sun:5,n:'32 km, the longest run of the plan. All easy. Fuel exactly as you will on race day.'},
 {p:2,l:{km:24,mp:12,pos:'mid'},q:['int',6,2,12],sat:9,sun:6,n:'12 km at goal pace inside the long run. Wear the shoes and kit you plan to race in.'},
 {p:2,l:{km:32,mp:8,pos:'end'},q:['tempo',3,10,2,11],sat:9,sun:5,n:'The last big one. After this the hard work is done and you are banking freshness.'},
 {p:3,l:{km:24,mp:5,pos:'end'},q:['mp',1,8,11],sat:8,sun:5,n:'Taper begins. You may feel flat or restless. Both are normal.'},
 {p:3,l:{km:16,mp:6,pos:'mid'},q:['int',4,2,9],sat:8,sun:5,n:'Short and sharp. Sleep, eat well, sort travel and kit.'},
 {p:3,l:{km:10},q:['sharp',7],sat:3,sun:42.2,n:'Race week. Nothing you do now adds fitness. Stay loose, eat your carbs, trust the work.'}];

const STR_A=[
 [['Goblet squat','3 × 10 with the 18 kg kettlebell. Slow down, stand up strongly.'],['Kettlebell deadlift','3 × 10. Hinge at the hips, flat back.'],['Split squat','3 × 8 each side. Keep the back foot flat on a step, laces down, so the big toe is not bent.'],['Single-leg calf raise','3 × 10 each side, 3 seconds down. Stay in a pain-free range.'],['Glute bridge','3 × 12, pause at the top.'],['Side plank','3 × 30 seconds each side.'],['Dead bug','3 × 8 each side.']],
 [['Kettlebell swing','4 × 12. Snap the hips, arms just guide.'],['Rear-foot-elevated split squat','3 × 8 each side holding dumbbells. Back foot laces down on a chair.'],['Single-leg deadlift','3 × 8 each side with a dumbbell.'],['Step-up','3 × 10 each side holding dumbbells. Control the way down.'],['Calf raise, straight then bent knee','3 × 12 of each, slow lowering.'],['Farmer carry','3 × 40 m with kettlebell and heaviest dumbbell, swap hands.'],['Side plank with leg lift','3 × 20 seconds each side.']],
 [['Kettlebell swing','3 × 12.'],['Rear-foot-elevated split squat','2 × 8 each side.'],['Single-leg deadlift','2 × 8 each side.'],['Single-leg calf raise','2 × 12 each side.'],['Single-leg glute bridge','2 × 10 each side.'],['Side plank','2 × 40 seconds each side.']],
 [['Goblet squat','2 × 8, lighter than usual.'],['Glute bridge','2 × 12.'],['Calf raise','2 × 12, both legs.'],['Side plank','2 × 30 seconds each side.'],['Dead bug','2 × 8 each side.']]];
const STR_B=[['Single-leg glute bridge','2 × 10 each side.'],['Side-lying leg raise','2 × 15 each side.'],['Bird dog','2 × 8 each side, slow.'],['Dumbbell row','2 × 10 each side.'],['Dumbbell overhead press','2 × 10.'],['Short-foot hold','2 × 30 seconds each foot. Draw the ball of the foot towards the heel without curling the toes.'],['Calf stretch','60 seconds each side, straight and bent knee.']];
const RESET=[['Hip flexor stretch','60 seconds each side.'],['Calf and soleus stretch','60 seconds each side.'],['Thoracic rotation','8 each side.'],['Big toe: gentle range of motion','1 minute, pain-free only. Roll the arch on a ball for 1 minute.'],['Legs up the wall','3 minutes. Breathe out slowly.']];

function P(){const t=S.tenK/10,mp=S.goal/42.195;return{easy:[t*1.25,t*1.38],steady:[t*1.15,t*1.19],mp:[mp-3,mp+3],tempo:[t*1.03,t*1.06],int:[t*.98,t*1.01],mpv:mp}}
const EZ=6.55; // minutes per km used to estimate easy-run duration
function gelPlan(min,wk){
  if(wk<2||min<75)return{n:0,txt:min<75?'Under 75 minutes. Water is enough.':'No gels yet. Carry water and notice how the last 20 minutes feel.'};
  if(wk===2)return{n:1,txt:'Your first gel. Take half at 45 minutes with a few mouthfuls of water and the rest at 60. Squeeze it in slowly. It will taste odd; that passes.'};
  const every=wk===3?45:wk<=5?40:wk<=11?35:30, first=wk<=5?45:30, n=Math.max(1,Math.floor((min-first-10)/every)+1);
  const g=wk===3?'about 25 g carbohydrate an hour':wk<=5?'about 30 g carbohydrate an hour':wk<=11?'about 40 g an hour':'45–60 g an hour, your race-day rate';
  return{n,txt:`${n} gel${n>1?'s':''}: first at ${first} minutes, then every ${every}. That is ${g}. Sip water with each one.`}}
let PLAN=[],BYID={};
function build(){
  const p=P();PLAN=[];
  WEEKS.forEach((w,i)=>{
    const n=i+1,ws=addD(START,i*7),last=n===NW;
    const add=(slot,day,o)=>PLAN.push(Object.assign({id:'w'+n+'-'+slot,week:n,base:addD(ws,day),ph:w.p},o));
    /* Monday long run */
    const L=w.l,lm=Math.round(L.km*EZ),g=gelPlan(lm,n);
    let lt='Long run',ls=[],why='The long run is the heart of marathon training. Time on feet at an easy effort builds the endurance nothing else can.';
    if(last){lt='Easy run';ls=[['Run',`${L.km} km easy at ${pr(p.easy)}. Flat if you can.`]];why='Keeps the legs turning over without costing anything.'}
    else if(L.tt){lt='Half marathon time trial';ls=[['Warm-up','2 km very easy, a few strides.'],['Main',`21.1 km at a strong, even effort. Start at ${pace(p.mpv-5)} /km and squeeze down if it feels good. Under 1:53 puts sub-4 firmly in reach.`],['After','Walk 5 minutes. Eat within the hour.']];why='A dress rehearsal for pacing, kit, breakfast and gels. Record your time when you log it.'}
    else if(L.mp&&L.pos==='mid'){const a=Math.round((L.km-L.mp)*.6),b=L.km-L.mp-a;lt='Long run with goal pace';ls=[['Easy',`${a} km at ${pr(p.easy)}.`],['Goal pace',`${L.mp} km at ${pr(p.mp)}. On road if you can.`],['Easy',`${b} km relaxed to finish.`]];why='Goal pace should start to feel like a rhythm you can sit in.'}
    else if(L.mp){lt='Long run, goal-pace finish';ls=[['Easy',`${L.km-L.mp} km at ${pr(p.easy)}.`],['Goal pace',`Last ${L.mp} km at ${pr(p.mp)}.`]];why='Running goal pace on tired legs is the most race-specific thing you can do.'}
    else if(L.steady){ls=[['Easy',`${L.km-L.steady} km at ${pr(p.easy)}.`],['Steady',`Last ${L.steady} km at ${pr(p.steady)}.`]]}
    else ls=[['Run',`${L.km} km at ${pr(p.easy)}. On trails, go by effort: you should be able to chat the whole way.`]];
    add('long',0,{kind:last?'easy':'long',title:lt,km:L.km,min:lm,steps:ls,why,tt:L.tt,
      fuel:last?'Normal meals. Start adding extra carbohydrate from Thursday.':(L.tt?'Race breakfast 3 hours before. ':'Carb-based breakfast 2 hours before: porridge, toast and honey, or a bagel. ')+g.txt,
      toe:L.km>=24?'Choose your most cushioned, stiffest-soled shoes. Softer ground for the easy kilometres is kinder to the toe.':''});
    /* Tuesday + Friday optional reset */
    if(!last){add('resetT',1,{kind:'reset',title:'15-minute reset',min:15,optional:true,ex:RESET,steps:[],why:'Optional. A long working day still has room for 15 minutes on the floor. Skip it without guilt.'});
      add('resetF',4,{kind:'reset',title:'15-minute reset',min:15,optional:true,ex:RESET,steps:[],why:'Optional. Loosens you up for the weekend runs.'})}
    /* Wednesday workout */
    const q=w.q;let Q;
    const wu=['Warm-up','2 km easy, then 4 × 20-second strides.'],cd=['Cool-down','1–2 km very easy.'];
    if(q[0]==='strides')Q={kind:'easy',title:'Easy run with strides',km:q[1],steps:[['Run',`${q[1]} km at ${pr(p.easy)}.`],['Strides','6 × 20 seconds fast but relaxed on a flat stretch, walk back between.']],why:'Strides keep your legs quick without any real strain.'};
    if(q[0]==='tempo')Q={title:`Tempo ${q[1]} × ${q[2]} min`,km:q[4],steps:[wu,['Main',`${q[1]} × ${q[2]} minutes at ${pr(p.tempo)}, ${q[3]} minutes easy jog between.`],cd],why:'Tempo running raises the pace you can hold comfortably, which makes goal pace feel easier.'};
    if(q[0]==='cont')Q={title:`Tempo ${q[1]} min continuous`,km:q[2],steps:[wu,['Main',`${q[1]} minutes unbroken at ${pr(p.tempo)}. Even effort from first minute to last.`],cd],why:'One unbroken block teaches you to hold concentration as well as pace.'};
    if(q[0]==='hills')Q={title:`Hills ${q[1]} × ${q[2]} sec`,km:q[3],steps:[['Warm-up','2–3 km easy to a steady hill.'],['Main',`${q[1]} × ${q[2]} seconds uphill at a strong effort, tall posture. Walk or jog down to recover.`],cd],why:'Hills build strength and power with less impact than fast flat running. If the toe complains pushing off, shorten your stride.'};
    if(q[0]==='fart')Q={title:`Fartlek ${q[1]} × ${q[2]} min`,km:q[4],steps:[['Warm-up','2 km easy.'],['Main',`${q[1]} × ${q[2]} minutes brisk (around ${pace(p.int[1])} /km), ${q[3]} minutes easy between. Go by feel.`],cd],why:'Unstructured speed. Good for a week when life is busy.'};
    if(q[0]==='int')Q={title:`Intervals ${q[1]} × 1 km`,km:q[3],steps:[wu,['Main',`${q[1]} × 1 km at ${pr(p.int)}, ${q[2]} minutes easy jog between. Road or flat path.`],cd],why:'Running at 10 km pace makes marathon pace feel slow. Stop one rep early if your form goes.'};

    const dot=(p,c,t)=>{const mk=L.circleMarker(p,{radius:6,color:'#053a57',weight:2,fillColor:c,fillOpacity:1}).addTo(m);if(t)mk.bindTooltip(t,{permanent:true,direction:'right',offset:[6,0]})};
    if(towns)towns.forEach((t,i)=>dot([t[1],t[2]],i===0||i===towns.length-1?'#f3c62f':'#fff',t[0]));else{dot(pts[0],'#fff');dot(pts[pts.length-1],'#f3c62f')}

function toeAdvice(){const e=PLAN.filter(s=>S.log[s.id]&&S.log[s.id].toe!=null).sort((a,b)=>dateOf(a)<dateOf(b)?1:-1).slice(0,2).map(s=>S.log[s.id].toe);
  if(!e.length||e[0]===0)return'';
  if(e[0]===2&&e[1]===2)return`<div class="note bad"><b>Two sore sessions in a row.</b> Swap the next two easy runs for the Peloton, and book a physio or podiatrist before the next long run.</div>`;

function vToday(){const t=TODAY(),n=clampW(wkOf(t)),w=WEEKS[n-1],ws=wkStats(n),T=totals(),left=diff(t,RACE);

function vPlan(){const t=TODAY(),cur=clampW(wkOf(t));let h=`<div><h1 class="h-page">The plan</h1><p class="muted">21 weeks, Monday 16 November to race day, Sunday 11 April. Tap a week to open it, tap a session to see it, log it or move it.</p></div>`,lp=-1;

function chartWeeks(){const cur=clampW(wkOf(TODAY())),W=340,H=150,l=26,b=18,top=8,max=70,bw=(W-l-4)/NW;let s='';

function chartLong(){const W=340,H=140,l=26,b=18,top=20,max=44,xs=n=>l+10+(n-1)*((W-l-20)/(NW-1)),ys=v=>H-b-(v/max)*(H-b-top);let s='',pts=[];

function vProgress(){const T=totals(),pd=prediction(),B=badges(),got=B.filter(b=>b.got).length,goal=S.goal;

  const focus=['Learn to eat for training. Carbohydrate before long runs, protein after every session, and your first gels on the Monday run from week 2.','Train the gut. Take a gel every 35 minutes on long runs and find the brand and flavours you can stomach.','Rehearse race day. Race breakfast before every long run, gels every 30 minutes, the same brand you will carry in Italy.','Carbohydrate loading from Thursday of race week. Nothing new, nothing clever.'][p];

  ${D2('Before a run',`<ul><li><b>Easy runs under an hour:</b> nothing special. A banana if it has been more than three hours since you ate.</li><li><b>Long runs and workouts:</b> a carb-based meal 2–3 hours before. Porridge with banana and honey, or toast and jam, or a bagel. Low in fat and fibre.</li><li><b>Fluids:</b> a large glass of water with breakfast. Coffee is fine if you normally have it.</li></ul>`)}
  ${D2('During a run',`<p>Anything over 75 minutes needs fuel. Start early and keep it regular. Waiting until you feel empty is too late.</p><table><tr><th>Weeks</th><th>How much</th><th>In practice</th></tr><tr><td>1</td><td>None</td><td>A one-mouthful taste test on Saturday</td></tr><tr><td>2</td><td>One gel</td><td>Half at 45 min, half at 60</td></tr><tr><td>3</td><td>About 25 g an hour</td><td>Gel at 45 min, then every 45</td></tr><tr><td>4–5</td><td>30 g an hour</td><td>Gel at 45 min, then every 40</td></tr><tr><td>6–11</td><td>40 g an hour</td><td>Gel at 30 min, then every 35</td></tr><tr><td>12–20</td><td>45–60 g an hour</td><td>Gel at 30 min, then every 30</td></tr></table><ul><li>Most gels carry 22–25 g. Buy a mixed box of three brands for the first month and keep what sits well.</li><li>Always take gels with water. Sip to thirst, roughly 400–600 ml an hour, with an electrolyte tablet on runs over 90 minutes.</li><li>A sloshy or cramping stomach usually means too much at once. Smaller, more often.</li><li>Every long run in this app tells you how many gels to carry.</li></ul>`)}
  ${D2('New to gels',`<p>Your gut needs training just like your legs. The plan builds it up slowly, and only on runs long enough to need it.</p><ul><li><b>Gels are for long runs only.</b> Easy runs, workouts, strength and the bike need none. Each session tells you.</li><li><b>Always with water,</b> a few mouthfuls each time. Without it they sit heavy.</li><li><b>Sip, do not gulp.</b> Take a gel over two or three minutes.</li><li><b>Buy singles of three brands first.</b> Thinner isotonic gels are the easiest starting point. Keep whichever sits best and stick with it to race day.</li><li><b>If gels will not sit,</b> chews or jelly babies work too: five jelly babies is roughly one gel.</li><li><b>No caffeine gels until week 12.</b> Then try one late in a long run, never for the first time in Italy.</li><li>Mild sloshing in the first few weeks is normal and settles. Cramping or nausea means too much too fast: go back a step.</li></ul>`)}

function celebrate(b,n){$('cele').innerHTML=`<div class="cele-card" role="alertdialog" aria-label="Milestone"><span class="plate"><img src="${RACE_LOGO}" alt=""></span><span class="medal">${b.m}</span><h2 style="font-size:26px;line-height:1.1">${esc(b.t)}</h2><p class="muted">${esc(b.s||'Another one banked on the road to Garda.')}${n>1?' Plus '+(n-1)+' more on your Progress page.':''}</p><button class="btn block" data-a="celeClose">Lovely</button></div>`;$('cele').classList.add('open');confetti()}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=$('confetti'),x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,cols=['#04a7e0','#3dbdee','#044d71','#f3c62f','#ffffff'];
  const ps=Array.from({length:90},()=>({x:W/2+(Math.random()-.5)*80,y:H*.42,vx:(Math.random()-.5)*9,vy:-Math.random()*11-4,s:Math.random()*7+4,r:Math.random()*6,c:cols[Math.random()*cols.length|0],o:Math.random()<.5}));
  let f=0;(function tick(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.22;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=.12;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-f/150);if(p.o){x.beginPath();x.ellipse(0,0,p.s*.7,p.s*.45,0,0,7);x.fill()}else x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<150)requestAnimationFrame(tick);else x.clearRect(0,0,W,H)})()}

/* ============ calendar export ============ */
function makeICS(){const z=s=>s.replace(/[-:]/g,''),e=s=>String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Road to Garda//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:Garda marathon training'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  PLAN.filter(s=>!s.optional).forEach(s=>{const d=dateOf(s),tm=s.kind==='race'?'09:00':S.times[dow(d)]||'09:00',[hh,mm]=tm.split(':').map(Number);
    let m0=hh*60+mm;if(s.id.endsWith('-bike')||s.id.endsWith('-strB'))m0+=BYID[s.id.replace(/-(bike|strB)$/,s.id.endsWith('-bike')?'-str':'-sat')]?.min||40;
    const st=new Date(D(d).getTime()+m0*6e4),en=new Date(st.getTime()+minOf(s)*6e4),f=x=>z(iso(x))+'T'+String(x.getHours()).padStart(2,'0')+String(x.getMinutes()).padStart(2,'0')+'00';
    const desc=[(s.steps||[]).map(x=>x[0]+': '+x[1]).join('\n'),s.ex?s.ex.map(x=>x[0]+': '+x[1]).join('\n'):'',fuelText(s)].filter(Boolean).join('\n\n');
    const sum=titleOf(s)+(isRun(s)&&s.km?' '+s.km+' km':'');
    L.push('BEGIN:VEVENT','UID:'+s.id+'@road-to-garda','DTSTAMP:'+stamp,'DTSTART:'+f(st),'DTEND:'+f(en),'SUMMARY:'+e(sum),'DESCRIPTION:'+e(desc),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e('In an hour: '+sum),'TRIGGER:-PT60M','END:VALARM');
    if(!s.id.endsWith('-bike')&&!s.id.endsWith('-strB'))L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e('Tomorrow: '+sum),'TRIGGER:-PT'+(m0+240)+'M','END:VALARM');
    L.push('END:VEVENT')});
  L.push('END:VCALENDAR');return L.join('\r\n')}
async function exportICS(){DN.forEach((_,i)=>{const v=$('f-t'+i)?.value;if(v)S.times[i]=v});save();
  const txt=makeICS(),file=new File([txt],'garda-training.ics',{type:'text/calendar'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Garda marathon training'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download='garda-training.ics';document.body.appendChild(a);a.click();a.remove();toast('Calendar file saved. Open it to add the sessions.')}

/* ============ Strava ============ */
const REDIR=()=>location.origin+location.pathname;
async function stravaPost(body){const r=await fetch('https://www.strava.com/oauth/token',{method:'POST',body:new URLSearchParams(body)});if(!r.ok)throw new Error('Strava said no ('+r.status+'). Check the Client ID and Secret.');return r.json()}
async function exchange(code){const st=S.strava;const j=await stravaPost({client_id:st.cid,client_secret:st.secret,code,grant_type:'authorization_code'});
  Object.assign(st,{refresh:j.refresh_token,access:j.access_token,exp:j.expires_at,athlete:j.athlete?(j.athlete.firstname||'')+' '+(j.athlete.lastname||''):''});save();await sync()}
async function token(){const st=S.strava;if(st.access&&st.exp>Date.now()/1000+120)return st.access;const j=await stravaPost({client_id:st.cid,client_secret:st.secret,grant_type:'refresh_token',refresh_token:st.refresh});Object.assign(st,{refresh:j.refresh_token,access:j.access_token,exp:j.expires_at});save();return st.access}
const SK={Run:'run',TrailRun:'run',VirtualRun:'run',Ride:'bike',VirtualRide:'bike',EBikeRide:'bike',GravelRide:'bike',MountainBikeRide:'bike',WeightTraining:'strength',Workout:'strength',Crossfit:'strength',HighIntensityIntervalTraining:'strength',Yoga:'reset',Pilates:'reset'};
function applyActs(acts){const by={};acts.forEach(a=>{const k=a.d+'|'+a.k;(by[k]=by[k]||[]).push(a)});const used={};let n=0;
  PLAN.forEach(s=>{const kk=isRun(s)?'run':kindOf(s),key=dateOf(s)+'|'+kk;if(used[key]||!by[key])return;used[key]=1;const as=by[key],prev=S.log[s.id]||{};
    if(prev.manual)return;const km=r1(as.reduce((t,a)=>t+a.km,0)),sec=as.reduce((t,a)=>t+a.sec,0),hrs=as.filter(a=>a.hr);
    if(prev.st!=='done')n++;markDone(s.id,{src:'strava',sec,hr:hrs.length?hrs.reduce((t,a)=>t+a.hr,0)/hrs.length:undefined,...(kk==='run'?{km,elev:as.reduce((t,a)=>t+(a.elev||0),0),poly:(as.slice().sort((x,y)=>y.km-x.km)[0]||{}).poly}:{})})});
  S.extra={};Object.keys(by).forEach(k=>{if(!used[k]&&k.endsWith('|run'))S.extra[k.split('|')[0]]=r1(by[k].reduce((t,a)=>t+a.km,0))});save();return n}
async function sync(quiet){if(!S.strava.refresh)return;try{const tk=await token(),after=Math.floor(D(addD(START,-1)).getTime()/1000);let acts=[];
    for(let p=1;p<=4;p++){const r=await fetch(`https://www.strava.com/api/v3/athlete/activities?after=${after}&per_page=100&page=${p}`,{headers:{Authorization:'Bearer '+tk}});if(!r.ok)throw new Error('Strava sync failed ('+r.status+').');const j=await r.json();
      j.forEach(a=>{const k=SK[a.sport_type||a.type];if(k)acts.push({d:(a.start_date_local||'').slice(0,10),k,km:(a.distance||0)/1000,sec:a.moving_time||0,hr:a.average_heartrate,elev:a.total_elevation_gain,poly:a.map&&a.map.summary_polyline})});if(j.length<100)break}
    const n=applyActs(acts);S.strava.last=Date.now();save();render();if(!quiet||n)toast(n?`Strava: ${n} session${n>1?'s':''} ticked off`:'Strava is up to date');checkBadges()}
  catch(e){if(!quiet)toast(e.message||'Could not reach Strava. Check your connection.')}}
function connect(){const cid=$('f-cid').value.trim(),sec=$('f-sec').value.trim();if(!cid||!sec){toast('Enter the Client ID and Client Secret first');return}
  S.strava=Object.assign(S.strava||{},{cid,secret:sec});save();
  location.href='https://www.strava.com/oauth/authorize?client_id='+encodeURIComponent(cid)+'&redirect_uri='+encodeURIComponent(REDIR())+'&response_type=code&approval_prompt=auto&scope=activity:read_all'}
async function handleReturn(){const q=new URLSearchParams(location.search),code=q.get('code');if(!code&&!q.get('error'))return;
  history.replaceState(null,'',location.pathname);if(!code){toast('Strava connection was cancelled');return}
  if(!S.strava||!S.strava.cid){openSheet(head('One more step','Strava opened in Safari, not in the app.')+`<div class="card"><p>Copy this code, open the app from the home screen, go to Coach, Strava, and paste it under “Strava opened in Safari instead?”.</p><label class="field">Code<input id="f-show" readonly value="${esc(code)}"></label><button class="btn" data-a="copyCode">Copy code</button></div>`);return}
  try{tab='more';await exchange(code);toast('Strava connected')}catch(e){toast(e.message)}}

 swap(){S.swaps[sheetId]?delete S.swaps[sheetId]:S.swaps[sheetId]=1;save();sessSheet(sheetId);render()},
 skip(){S.log[sheetId]=Object.assign(S.log[sheetId]||{},{st:'skip',at:TODAY()});save();closeSheet();render();toast('Skipped. No catching up needed.')},
 undo(){delete S.log[sheetId];save();sessSheet(sheetId);render()},
 bar(d){const w=wkStats(+d.n);$('barcap').textContent=`Week ${d.n} (${fD(wkStart(+d.n))}): ${w.doneKm} of ${w.planKm} km.`},
 celeClose(){$('cele').classList.remove('open')},
 saveSet(){const g=parseT($('f-goal').value),t=parseT($('f-10k').value);if(!g||g<9000||g>25200){toast('Enter the goal as h:mm:ss, for example 3:58:00');return}if(!t||t<1500||t>5400){toast('Enter the 10 km time as mm:ss, for example 50:00');return}
   S.name=$('f-name').value.trim()||'Laura';S.bib=$('f-bib').value.trim();S.goal=g;S.tenK=t;save();build();render();toast('Saved. Paces updated.')},
 wxHere(){if(!navigator.geolocation){toast('Location is not available in this browser');return}navigator.geolocation.getCurrentPosition(p=>{S.loc={lat:+p.coords.latitude.toFixed(3),lon:+p.coords.longitude.toFixed(3),name:'your current location'};save();render();loadWx(true);toast('Weather now follows your location')},()=>toast('Location was not shared. Allow it in Settings, Safari, Location.'))},
 wxHome(){delete S.loc;save();render();loadWx(true)},
 ics(){exportICS()},connect(){connect()},sync(){toast('Syncing with Strava');sync()},
 unlink(){S.strava={cid:S.strava.cid,secret:S.strava.secret};save();render();toast('Strava disconnected')},
 async code(){const v=$('f-code').value.trim(),cid=$('f-cid').value.trim(),sec=$('f-sec').value.trim();if(!v||!cid||!sec){toast('Enter the Client ID, Secret and code');return}S.strava=Object.assign(S.strava||{},{cid,secret:sec});save();try{await exchange(v);toast('Strava connected')}catch(e){toast(e.message)}},
 async copyCode(){try{await navigator.clipboard.writeText($('f-show').value);toast('Code copied')}catch(e){$('f-show').select();toast('Select the code and copy it')}},
 async backup(){const txt=JSON.stringify(S);try{await navigator.clipboard.writeText(txt);toast('Backup copied. Paste it into Notes.')}catch(e){openSheet(head('Backup','Select all of this text and copy it.')+`<textarea rows="8" style="width:100%;border-radius:12px;padding:12px;background:var(--surface);border:1.5px solid var(--line)">${esc(txt)}</textarea>`)}},
 restoreOpen(){openSheet(head('Restore a backup','Paste the backup text. This replaces what is on this phone.')+`<textarea id="f-res" rows="6" style="width:100%;border-radius:12px;padding:12px;background:var(--surface);border:1.5px solid var(--line)"></textarea><button class="btn block" data-a="restore">Restore</button>`)},
 restore(){try{const j=JSON.parse($('f-res').value);if(!j||!j.log)throw 0;S=Object.assign(JSON.parse(JSON.stringify(DEF)),j);save();build();closeSheet();render();toast('Backup restored')}catch(e){toast('That text is not a backup from this app')}},
 resetOpen(){openSheet(head('Clear all progress?','Removes every logged session, move and milestone from this phone. Strava and settings stay.')+`<button class="btn block" style="background:var(--bad);color:#fff" data-a="reset">Clear progress</button><button class="btn ghost block" data-a="close">Keep it</button>`)},
 reset(){S.log={};S.moves={};S.swaps={};S.extra={};S.seen={};S.open={};save();closeSheet();render();toast('Progress cleared')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();$('cele').classList.remove('open')}});

/* ============ go ============ */
build();render();handleReturn();loadWx();
if(S.strava&&S.strava.refresh&&(!S.strava.last||Date.now()-S.strava.last>18e5))sync(true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();loadWx();if(S.strava&&S.strava.refresh&&Date.now()-(S.strava.last||0)>18e5)sync(true)}});
</script>
</body>
